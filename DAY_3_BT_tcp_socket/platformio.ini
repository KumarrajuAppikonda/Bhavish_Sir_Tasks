; PlatformIO project: ESP32 Wi-Fi AP + TCP socket configuration manager
; Put main.cpp in the  src/  folder.

[env:esp32dev]
platform = espressif32@6.5.0        ; Arduino-ESP32 core 2.0.14 (WiFiServer API used in main.cpp)
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter     ; lets you type CLEARNVS + Enter in the serial monitor

build_flags =
    -DCORE_DEBUG_LEVEL=0            ; keeps the live serial status line clean

lib_deps =
    fastled/FastLED@^3.6.0
; WiFi, Preferences and HTTPClient are built into the Arduino-ESP32 framework.
