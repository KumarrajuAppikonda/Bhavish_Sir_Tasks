[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

upload_speed = 115200

; Required libraries
lib_deps =
    fastled/FastLED@^3.10.8

; Flash configuration
board_build.flash_size = 4MB
board_build.partitions = default.csv

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=0